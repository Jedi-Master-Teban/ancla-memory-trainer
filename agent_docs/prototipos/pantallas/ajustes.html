<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Pantalla — Ajustes</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;700;800&family=Lora:ital,wght@0,500;0,600;0,700;1,500&family=Karla:wght@400;500;700&display=swap">
  <style>
    html, body { margin: 0; background: #0d0d10; }
    * { box-sizing: border-box; }
    body { display: flex; flex-direction: column; align-items: center; gap: 16px; padding: 32px 16px; font-family: sans-serif; }
    #hint { color: #a6adc8; font-size: 13px; text-align: center; max-width: 375px; }
  </style>
</head>
<body>
  <div id="hint">Toca cualquiera de las dos opciones de abajo — es el selector real, no un botón aparte.</div>
  <div id="root"></div>

<script>
const PALETAS = {
  arcade: {
    bg: 'oklch(0.19 0.05 280)',
    bgGradient: 'radial-gradient(circle 380px at 85% 0%, oklch(0.30 0.09 350 / 0.55), transparent), radial-gradient(circle 340px at 0% 15%, oklch(0.28 0.09 210 / 0.5), transparent)',
    card: 'oklch(0.25 0.06 280)',
    accent1: 'oklch(0.78 0.15 210)',
    ink: 'oklch(0.98 0.005 280)',
    inkMuted: 'oklch(0.72 0.03 280)',
    fontDisplay: "'Fredoka', sans-serif",
    fontBody: "'Nunito', sans-serif",
  },
  papel: {
    bg: 'oklch(0.21 0.02 60)',
    bgGradient: 'repeating-linear-gradient(0deg, oklch(1 0 0 / 0.012) 0px, transparent 1px, transparent 2px)',
    card: 'oklch(0.26 0.025 60)',
    accent1: 'oklch(0.64 0.13 40)',
    ink: 'oklch(0.93 0.015 70)',
    inkMuted: 'oklch(0.70 0.02 60)',
    fontDisplay: "'Lora', Georgia, serif",
    fontBody: "'Karla', sans-serif",
  },
};

function calcularTokens(theme) {
  const p = PALETAS[theme];
  const esArcade = theme === 'arcade';

  function opcionStyle(seleccionada) {
    const base = esArcade
      ? `display:flex;align-items:center;gap:14px;background:${p.card};border-radius:18px;padding:14px;cursor:pointer;`
      : `display:flex;align-items:center;gap:14px;background:${p.card};border-radius:2px;padding:14px;cursor:pointer;`;
    const borde = seleccionada
      ? (esArcade ? `border:2px solid ${p.accent1};` : `border:1px solid ${p.accent1};`)
      : (esArcade ? `border:2px solid transparent;` : `border:1px solid oklch(0.34 0.025 60);`);
    return base + borde;
  }
  function checkStyle(seleccionada) {
    if (!seleccionada) return 'width:22px;height:22px;';
    return esArcade
      ? `width:22px;height:22px;border-radius:999px;background:${p.accent1};display:flex;align-items:center;justify-content:center;`
      : `width:22px;height:22px;border-radius:2px;border:1.5px solid ${p.accent1};display:flex;align-items:center;justify-content:center;`;
  }

  const checkIconColor = esArcade ? 'oklch(0.15 0.03 280)' : p.accent1;

  return {
    ...p,
    esArcade,
    esPapel: !esArcade,
    opcionArcadeStyle: opcionStyle(esArcade),
    opcionPapelStyle: opcionStyle(!esArcade),
    checkArcadeStyle: checkStyle(esArcade),
    checkPapelStyle: checkStyle(!esArcade),
    checkIconColor,
    configWrapStyle: esArcade ? `background:${p.card};border-radius:18px;padding:4px 18px;` : `padding:0;`,
    configRowStyle: esArcade
      ? `display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid oklch(1 0 0 / 0.06);`
      : `display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-bottom:1px solid oklch(0.34 0.025 60);`,
    configRowLastStyle: esArcade
      ? `display:flex;justify-content:space-between;align-items:center;padding:14px 0;`
      : `display:flex;justify-content:space-between;align-items:center;padding:13px 0;`,
  };
}

const CHECK_SVG = (color) => `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="${color}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>`;

function renderHTML(t) {
  return `
  <div style="width:375px;height:812px;position:relative;overflow:hidden;background:${t.bg};background-image:${t.bgGradient};font-family:${t.fontBody};border-radius:12px;">
    <div style="position:relative;padding:60px 20px 28px;display:flex;flex-direction:column;gap:28px;">

      <span style="font-family:${t.fontDisplay};font-size:22px;font-weight:700;color:${t.ink};">Ajustes</span>

      <div>
        <div style="font-family:${t.fontDisplay};font-size:14px;color:${t.ink};font-weight:600;margin-bottom:4px;">Estilo visual</div>
        <div style="font-size:13px;color:${t.inkMuted};margin-bottom:14px;">Elige cómo se ve toda la app.</div>

        <div style="display:flex;flex-direction:column;gap:12px;">

          <div style="${t.opcionArcadeStyle}" onclick="elegirTema('arcade')">
            <div style="width:52px;height:52px;border-radius:14px;flex-shrink:0;background:linear-gradient(135deg, oklch(0.78 0.15 210), oklch(0.70 0.21 350) 50%, oklch(0.82 0.19 140));"></div>
            <div style="flex:1;">
              <div style="font-family:${t.fontDisplay};font-size:15px;font-weight:700;color:${t.ink};">Arcade Neón</div>
              <div style="font-size:12.5px;color:${t.inkMuted};margin-top:2px;">Colorido, redondeado, gamificado</div>
            </div>
            <div style="${t.checkArcadeStyle}">${t.esArcade ? CHECK_SVG(t.checkIconColor) : ''}</div>
          </div>

          <div style="${t.opcionPapelStyle}" onclick="elegirTema('papel')">
            <div style="width:52px;height:52px;border-radius:14px;flex-shrink:0;background:linear-gradient(135deg, oklch(0.64 0.13 40), oklch(0.62 0.07 135) 50%, oklch(0.93 0.015 70));"></div>
            <div style="flex:1;">
              <div style="font-family:${t.fontDisplay};font-size:15px;font-weight:700;color:${t.ink};">Papel y Tinta</div>
              <div style="font-size:12.5px;color:${t.inkMuted};margin-top:2px;">Cálido, editorial, silencioso</div>
            </div>
            <div style="${t.checkPapelStyle}">${t.esPapel ? CHECK_SVG(t.checkIconColor) : ''}</div>
          </div>

        </div>
      </div>

      <div>
        <div style="font-family:${t.fontDisplay};font-size:14px;color:${t.ink};font-weight:600;margin-bottom:10px;">Práctica</div>
        <div style="${t.configWrapStyle}">
          <div style="${t.configRowStyle}">
            <span style="font-size:14.5px;color:${t.ink};">Meta diaria</span>
            <span style="font-family:${t.fontDisplay};font-size:14.5px;color:${t.accent1};font-weight:700;">20 tarjetas</span>
          </div>
          <div style="${t.configRowLastStyle}">
            <span style="font-size:14.5px;color:${t.ink};">Recordatorio</span>
            <span style="font-family:${t.fontDisplay};font-size:14.5px;color:${t.accent1};font-weight:700;">8:00 pm</span>
          </div>
        </div>
      </div>

    </div>
  </div>`;
}

let temaActual = 'arcade';
function pintar() {
  document.getElementById('root').innerHTML = renderHTML(calcularTokens(temaActual));
}
function elegirTema(tema) {
  temaActual = tema;
  pintar();
}
pintar();
</script>
</body>
</html>
