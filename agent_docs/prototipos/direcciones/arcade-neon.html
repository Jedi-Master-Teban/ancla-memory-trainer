<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Dirección B — Arcade Neón</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;700;800&display=swap">
  <style>
    html, body { margin: 0; background: #0d0d10; display: flex; justify-content: center; padding: 32px 16px; }

    :root {
      --bg: oklch(0.19 0.05 280);
      --card: oklch(0.25 0.06 280);
      --card-hi: oklch(0.30 0.07 280);
      --cyan: oklch(0.78 0.15 210);
      --pink: oklch(0.70 0.21 350);
      --lime: oklch(0.82 0.19 140);
      --ink: oklch(0.98 0.005 280);
      --ink-muted: oklch(0.72 0.03 280);
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); font-family: 'Nunito', sans-serif; }
    a { color: var(--cyan); } a:hover { color: oklch(0.85 0.15 210); }
    .display { font-family: 'Fredoka', sans-serif; }
  
  </style>
</head>
<body>
<div style="width:375px;height:812px;background:var(--bg);position:relative;overflow:hidden;background-image:radial-gradient(circle 380px at 85% 0%, oklch(0.30 0.09 350 / 0.55), transparent),radial-gradient(circle 340px at 0% 15%, oklch(0.28 0.09 210 / 0.5), transparent);">

  <div style="position:relative;padding:60px 20px 28px;display:flex;flex-direction:column;gap:18px;">

    <!-- Racha -->
    <div style="background:linear-gradient(135deg, oklch(0.30 0.09 60), oklch(0.24 0.10 30));border-radius:24px;padding:18px 20px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 8px 24px oklch(0.15 0.05 30 / 0.5), inset 0 1px 0 oklch(1 0 0 / 0.15);">
      <div style="display:flex;align-items:center;gap:12px;">
        <div style="position:relative;width:40px;height:44px;">
          <div style="position:absolute;left:6px;top:2px;width:28px;height:34px;background:linear-gradient(180deg, oklch(0.85 0.17 85), oklch(0.68 0.20 40));border-radius:50% 50% 50% 50% / 65% 65% 35% 35%;filter:drop-shadow(0 0 10px oklch(0.75 0.19 50 / 0.8));"></div>
          <div style="position:absolute;left:13px;top:16px;width:14px;height:18px;background:oklch(0.92 0.14 95);border-radius:50% 50% 50% 50% / 65% 65% 35% 35%;"></div>
        </div>
        <div class="display" style="font-size:32px;font-weight:700;color:#fff;line-height:1;">7</div>
      </div>
      <div style="background:oklch(1 0 0 / 0.18);border-radius:999px;padding:8px 16px;">
        <span class="display" style="font-size:13px;color:#fff;font-weight:600;">Ver racha →</span>
      </div>
    </div>

    <!-- Meta diaria -->
    <div style="background:var(--card);border-radius:20px;padding:18px 20px;">
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <span class="display" style="font-size:15px;color:var(--ink);font-weight:600;">Meta de hoy</span>
        <span class="display" style="font-size:18px;color:var(--cyan);font-weight:700;">12<span style="color:var(--ink-muted);font-size:14px;"> / 20</span></span>
      </div>
      <div style="height:14px;background:oklch(0.15 0.03 280);border-radius:999px;margin-top:12px;overflow:hidden;box-shadow:inset 0 2px 4px oklch(0 0 0 / 0.3);">
        <div style="width:60%;height:100%;background:linear-gradient(90deg, var(--cyan), var(--lime));border-radius:999px;box-shadow:0 0 10px oklch(0.78 0.15 210 / 0.7);"></div>
      </div>
    </div>

    <!-- Pendientes -->
    <div style="margin-top:4px;">
      <div class="display" style="font-size:14px;color:var(--ink);font-weight:700;margin-bottom:12px;">¡A practicar!</div>

      <div style="display:flex;flex-direction:column;gap:10px;">

        <div style="display:flex;align-items:center;justify-content:space-between;background:var(--card);border-radius:18px;padding:14px 18px;">
          <div style="display:flex;align-items:center;gap:12px;">
            <div style="width:34px;height:34px;border-radius:12px;background:oklch(0.35 0.09 210);display:flex;align-items:center;justify-content:center;">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--cyan)" stroke-width="2.2" stroke-linecap="round"><path d="M12 3v11a3 3 0 1 0 3-3"/></svg>
            </div>
            <span class="display" style="color:var(--ink);font-size:15px;font-weight:600;">Colgadero</span>
          </div>
          <div style="background:var(--cyan);border-radius:999px;min-width:28px;height:28px;display:flex;align-items:center;justify-content:center;padding:0 8px;">
            <span class="display" style="color:oklch(0.18 0.03 280);font-size:14px;font-weight:700;">18</span>
          </div>
        </div>

        <div style="display:flex;align-items:center;justify-content:space-between;background:var(--card);border-radius:18px;padding:14px 18px;">
          <div style="display:flex;align-items:center;gap:12px;">
            <div style="width:34px;height:34px;border-radius:12px;background:oklch(0.35 0.13 350);display:flex;align-items:center;justify-content:center;">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--pink)" stroke-width="2.2"><rect x="5" y="3" width="14" height="18" rx="3"/><circle cx="12" cy="12" r="2.5" fill="var(--pink)" stroke="none"/></svg>
            </div>
            <span class="display" style="color:var(--ink);font-size:15px;font-weight:600;">Naipes</span>
          </div>
          <div style="background:var(--pink);border-radius:999px;min-width:28px;height:28px;display:flex;align-items:center;justify-content:center;padding:0 8px;">
            <span class="display" style="color:oklch(0.18 0.03 280);font-size:14px;font-weight:700;">6</span>
          </div>
        </div>

        <div style="display:flex;align-items:center;justify-content:space-between;background:var(--card);border-radius:18px;padding:14px 18px;">
          <div style="display:flex;align-items:center;gap:12px;">
            <div style="width:34px;height:34px;border-radius:12px;background:oklch(0.35 0.14 140);display:flex;align-items:center;justify-content:center;">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--lime)" stroke-width="2.2"><rect x="3" y="8" width="10" height="8" rx="4"/><rect x="11" y="8" width="10" height="8" rx="4"/></svg>
            </div>
            <span class="display" style="color:var(--ink);font-size:15px;font-weight:600;">Listas</span>
          </div>
          <div style="background:var(--lime);border-radius:999px;min-width:28px;height:28px;display:flex;align-items:center;justify-content:center;padding:0 8px;">
            <span class="display" style="color:oklch(0.18 0.03 280);font-size:14px;font-weight:700;">2</span>
          </div>
        </div>

        <div style="display:flex;align-items:center;justify-content:space-between;background:var(--card);border-radius:18px;padding:14px 18px;">
          <div style="display:flex;align-items:center;gap:12px;">
            <div style="width:34px;height:34px;border-radius:12px;background:oklch(0.35 0.10 85);display:flex;align-items:center;justify-content:center;">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="oklch(0.82 0.15 85)" stroke-width="2.2"><rect x="5" y="11" width="14" height="9" rx="3"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
            </div>
            <span class="display" style="color:var(--ink);font-size:15px;font-weight:600;">Números</span>
          </div>
          <div style="background:oklch(0.82 0.15 85);border-radius:999px;min-width:28px;height:28px;display:flex;align-items:center;justify-content:center;padding:0 8px;">
            <span class="display" style="color:oklch(0.18 0.03 280);font-size:14px;font-weight:700;">1</span>
          </div>
        </div>

      </div>
    </div>

    <!-- CTA -->
    <button style="margin-top:10px;background:linear-gradient(135deg, var(--cyan), oklch(0.65 0.18 250));border:none;border-radius:20px;padding:19px;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;box-shadow:0 10px 0 oklch(0.45 0.13 240), 0 12px 20px oklch(0.15 0.05 280 / 0.5);">
      <span class="display" style="color:oklch(0.15 0.03 280);font-size:17px;font-weight:700;">¡Practicar ahora!</span>
    </button>

    <div style="text-align:center;margin-top:4px;">
      <span class="display" style="font-size:13px;color:var(--ink-muted);font-weight:600;">Ver estadísticas →</span>
    </div>

  </div>
</div>
</body>
</html>
