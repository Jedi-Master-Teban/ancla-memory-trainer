<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Dirección C — Papel y Tinta</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;0,700;1,500&family=Karla:wght@400;500;700&display=swap">
  <style>
    html, body { margin: 0; background: #0d0d10; display: flex; justify-content: center; padding: 32px 16px; }

    :root {
      --bg: oklch(0.21 0.02 60);
      --card: oklch(0.26 0.025 60);
      --hairline: oklch(0.34 0.025 60);
      --rust: oklch(0.64 0.13 40);
      --rust-dim: oklch(0.48 0.09 40);
      --sage: oklch(0.62 0.07 135);
      --ink: oklch(0.93 0.015 70);
      --ink-muted: oklch(0.70 0.02 60);
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); font-family: 'Karla', sans-serif; }
    a { color: var(--rust); } a:hover { color: oklch(0.72 0.13 40); }
    .display { font-family: 'Lora', Georgia, serif; }
  
  </style>
</head>
<body>
<div style="width:375px;height:812px;background:var(--bg);position:relative;overflow:hidden;background-image:repeating-linear-gradient(0deg, oklch(1 0 0 / 0.012) 0px, transparent 1px, transparent 2px);">

  <div style="position:relative;padding:60px 24px 30px;display:flex;flex-direction:column;gap:24px;">

    <!-- Racha -->
    <div style="display:flex;align-items:flex-end;justify-content:space-between;border-bottom:1px solid var(--hairline);padding-bottom:18px;">
      <div style="display:flex;align-items:center;gap:16px;">
        <svg width="30" height="34" viewBox="0 0 24 24" fill="var(--rust)"><path d="M12 2c1.2 3.3-1.7 4.6-1.7 8.2A3.7 3.7 0 0 0 14 14a3.7 3.7 0 0 0 3.7-3.7c0-1.6-1-2.7-1.4-3.2.3 1.8-.7 2.9-1.4 3-.2-2.7-2-3.6-1.2-6C13 3 12.5 2.4 12 2z"/><path d="M9 15.3a3 3 0 0 0 6 0c0-1-.6-1.9-1.4-2.7.3 1.3-.6 1.9-1 1.9-1 0-.7-1.2-.3-2-1.8.6-3.3 1.5-3.3 2.8z"/></svg>
        <div>
          <div class="display" style="font-size:34px;font-weight:600;color:var(--ink);line-height:1;">7</div>
          <div style="font-size:12.5px;color:var(--ink-muted);margin-top:5px;">días seguidos</div>
        </div>
      </div>
      <span style="font-size:13.5px;color:var(--rust);font-style:italic;">Ver racha →</span>
    </div>

    <!-- Meta diaria -->
    <div>
      <div style="display:flex;justify-content:space-between;align-items:baseline;">
        <span class="display" style="font-size:16px;color:var(--ink);font-style:italic;">Meta de hoy</span>
        <span style="font-size:14px;color:var(--ink-muted);">12 de 20 tarjetas</span>
      </div>
      <div style="height:3px;background:var(--hairline);border-radius:2px;margin-top:10px;overflow:hidden;">
        <div style="width:60%;height:100%;background:var(--rust);"></div>
      </div>
    </div>

    <!-- Pendientes -->
    <div>
      <div class="display" style="font-size:17px;color:var(--ink);font-weight:600;margin-bottom:14px;">Pendientes por categoría</div>

      <div style="display:flex;flex-direction:column;">

        <div style="display:flex;align-items:center;justify-content:space-between;padding:15px 0;border-bottom:1px solid var(--hairline);">
          <div style="display:flex;align-items:center;gap:14px;">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="var(--sage)" stroke-width="1.6" stroke-linecap="round"><path d="M12 3v11a3 3 0 1 0 3-3"/></svg>
            <span class="display" style="color:var(--ink);font-size:16.5px;">Colgadero</span>
          </div>
          <span style="color:var(--ink-muted);font-size:15px;font-variant-numeric:oldstyle-nums;">18</span>
        </div>

        <div style="display:flex;align-items:center;justify-content:space-between;padding:15px 0;border-bottom:1px solid var(--hairline);">
          <div style="display:flex;align-items:center;gap:14px;">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="var(--sage)" stroke-width="1.6"><rect x="5" y="3" width="14" height="18" rx="2"/><circle cx="12" cy="12" r="2.2" fill="var(--sage)" stroke="none"/></svg>
            <span class="display" style="color:var(--ink);font-size:16.5px;">Naipes</span>
          </div>
          <span style="color:var(--ink-muted);font-size:15px;">6</span>
        </div>

        <div style="display:flex;align-items:center;justify-content:space-between;padding:15px 0;border-bottom:1px solid var(--hairline);">
          <div style="display:flex;align-items:center;gap:14px;">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="var(--sage)" stroke-width="1.6"><rect x="3" y="8" width="10" height="8" rx="4"/><rect x="11" y="8" width="10" height="8" rx="4"/></svg>
            <span class="display" style="color:var(--ink);font-size:16.5px;">Listas</span>
          </div>
          <span style="color:var(--ink-muted);font-size:15px;">2</span>
        </div>

        <div style="display:flex;align-items:center;justify-content:space-between;padding:15px 0;">
          <div style="display:flex;align-items:center;gap:14px;">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="var(--sage)" stroke-width="1.6"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
            <span class="display" style="color:var(--ink);font-size:16.5px;">Números</span>
          </div>
          <span style="color:var(--ink-muted);font-size:15px;">1</span>
        </div>

      </div>
    </div>

    <!-- CTA -->
    <button style="margin-top:8px;background:var(--rust);border:none;border-radius:2px;padding:17px;display:flex;align-items:center;justify-content:center;gap:10px;cursor:pointer;">
      <span class="display" style="color:oklch(0.21 0.02 60);font-size:16px;font-weight:600;">Practicar ahora</span>
    </button>

    <div style="text-align:center;">
      <span style="font-size:13px;color:var(--ink-muted);">Ver estadísticas →</span>
    </div>

  </div>
</div>
</body>
</html>
